<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер валют &mdash; Задание 1</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .page-header { background: linear-gradient(135deg, #1e3a8a, #7c3aed); }
  </style>
</head>
<body class="bg-light">

<nav class="navbar bg-white border-bottom sticky-top py-2">
  <div class="container-fluid">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a href="index.html"><i class="bi bi-arrow-left me-1"></i>Назад</a>
        </li>
        <li class="breadcrumb-item active">Задание 1 &mdash; Конвертер валют</li>
      </ol>
    </nav>
  </div>
</nav>

<div class="page-header text-white text-center py-4">
  <div class="container">
    <h1 class="h3 fw-bold mb-1">Конвертер валют</h1>
    <p class="mb-0 opacity-75 small">Рубли &rarr; Китайский юань (CNY)</p>
  </div>
</div>

<main class="container py-4" style="max-width:480px">

  <div class="card shadow-sm">
    <div class="card-body">

      <div class="mb-3">
        <label for="surname" class="form-label fw-semibold">Фамилия</label>
        <input type="text" class="form-control" id="surname" placeholder="Например: Иванов">
      </div>

      <div class="mb-3">
        <label for="amount" class="form-label fw-semibold">Сумма в рублях</label>
        <div class="input-group">
          <span class="input-group-text">&#8381;</span>
          <input type="number" class="form-control" id="amount" placeholder="0" min="0" step="any">
        </div>
      </div>

      <button class="btn btn-primary w-100 fw-semibold" id="convert-btn">
        Конвертировать
      </button>

      <div id="result-box" class="mt-3 p-3 rounded-3 text-center d-none"
           style="background:linear-gradient(135deg,#eff6ff,#f5f3ff);border:1.5px solid #bfdbfe">
        <div class="fs-4 fw-bold text-primary" id="result-value"></div>
        <div class="text-muted small mt-1" id="result-detail"></div>
      </div>

    </div>
  </div>


</main>

<script src="js/task1.js"></script>
</body>
</html>
